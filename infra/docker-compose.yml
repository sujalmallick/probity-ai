# Full local stack (Postgres + API + web). Settings come from apps/api/.env (git-ignored); the database URLs are
# overridden here to point at the postgres service. Nothing is seeded: sign in with Clerk and add your own data.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: probity, POSTGRES_PASSWORD: probity, POSTGRES_DB: probity }
    ports: ["127.0.0.1:5432:5432"]  # backing services are never exposed beyond this machine
    volumes: [pgdata:/var/lib/postgresql/data, ./postgres:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U probity"], interval: 5s, retries: 10 }
  api:
    build: { context: .., dockerfile: infra/api.Dockerfile }
    env_file: [../apps/api/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://probity_app:probity_app@postgres:5432/probity
      DATABASE_MIGRATE_URL: postgresql+psycopg://probity:probity@postgres:5432/probity
      TASK_BACKEND: inline
    ports: ["8010:8000"]
    depends_on: { postgres: { condition: service_healthy } }
  web:
    build: { context: .., dockerfile: infra/web.Dockerfile }
    ports: ["5180:80"]
    depends_on: [api]
volumes:
  pgdata:
