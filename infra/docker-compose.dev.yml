# Local backing services for development:  docker compose -f infra/docker-compose.dev.yml up -d
# Connect with 127.0.0.1, not localhost: the ports are bound to IPv4 only, and "localhost" may try IPv6 first and hang.
# Redis is optional (only for TASK_BACKEND=celery):  docker compose -f infra/docker-compose.dev.yml --profile worker up -d
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: probity, POSTGRES_PASSWORD: probity, POSTGRES_DB: probity }
    ports: ["127.0.0.1:5434:5432"]
    volumes: [pgdata-dev:/var/lib/postgresql/data, ./postgres:/docker-entrypoint-initdb.d:ro]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U probity"], interval: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    profiles: [worker]
    ports: ["127.0.0.1:6380:6379"]
volumes:
  pgdata-dev:
