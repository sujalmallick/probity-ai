[project]
name = "probity"
version = "0.1.0"
description = "Probity — Evidence before payment. AI business investigation agent for SMB invoices."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pdfplumber>=0.11",
  "reportlab>=4.0",
  "rapidfuzz>=3.9",
  "langgraph>=0.2",
  "pyjwt>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42",
]

[project.optional-dependencies]
live = ["anthropic>=0.60", "psycopg[binary]>=3.2"]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probity = ["fixtures/*.json", "llm/prompts/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
