[project]
name = "probity"
version = "0.1.0"
description = "Probity — Evidence before payment. AI business investigation agent for SMB invoices."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "anthropic>=0.60",
  "pdfplumber>=0.11",
  "pypdfium2>=4.30",
  "pikepdf>=9.0",  # rewrites every uploaded PDF without active content (replaces a resident virus scanner)
  "reportlab>=4.0",
  "rapidfuzz>=3.9",
  "langgraph>=0.2",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "cryptography>=42",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "sentry-sdk>=2.0",
]

[project.optional-dependencies]
# Optional: TASK_BACKEND=celery (separate worker) and live progress fan-out across processes.
worker = ["celery>=5.4", "redis>=5.0"]
# Optional: STORAGE_BACKEND=s3.
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
probity = ["llm/prompts/*/*.md", "risk/*.json", "db/migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
