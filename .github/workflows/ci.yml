name: ci
on: [push, pull_request]
permissions:
  contents: read  # the default token never needs write access here
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: probity, POSTGRES_PASSWORD: probity, POSTGRES_DB: probity }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U probity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest creates the non-superuser probity_app role and a throwaway database from this admin URL
      TEST_POSTGRES_ADMIN_URL: postgresql+psycopg://probity:probity@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # Exact versions from the lock, then the app itself without re-resolving dependencies.
      - run: pip install -r apps/api/requirements-dev.lock && pip install --no-deps -e apps/api
      - run: cd apps/api && pytest -q
      - run: pip install pip-audit && pip-audit -r apps/api/requirements-full.lock
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd apps/web && npm ci && npx tsc --noEmit && npm run build
      - run: cd apps/web && npm audit --omit=dev --audit-level=high
